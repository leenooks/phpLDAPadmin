name: Create Docker Image
run-name: ${{ gitea.actor }} Building Docker Image 🐳
on:
  push:
    branches:
      - '2.*-dev'
    tags:
      - '2.*'
env:
  VERSION: ${{ gitea.ref_name == 'master' && 'latest' || gitea.ref_name }}

jobs:
  test:
    strategy:
      matrix:
        arch:
        - x86_64
        # arm64

    name: Test Application
    runs-on: docker-${{ matrix.arch }}
    container:
      image: docker:cli
      privileged: false

    steps:
    - name: Environment Setup
      run: |
        if [ -n "${HTTP_PROXY}" ]; then echo "HTTP PROXY [${HTTP_PROXY}]"; sed -i -e s'/https/http/' /etc/apk/repositories; fi
        apk add git nodejs npm tar zstd

    - name: Code Checkout
      uses: actions/checkout@v4

    - name: Build Assets
      run: |
        npm ci
        npm run build

    - name: Cache page assets
      id: cache-page-assets
      uses: actions/cache@v6
      with:
        path: |
          public/build
        key: pla-page-assets-${{ gitea.sha }}

  build:
    strategy:
      matrix:
        include:
        - arch: x86_64
          goarch: amd64
        - arch: arm64
          goarch: arm64
        - arch: s390x
          goarch: s390x

    needs: [test]

    name: Build Docker Image
    runs-on: docker-${{ matrix.arch }}
    container:
      image: alpine
      privileged: false
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    env:
      DOCKER_HOST: unix:///var/run/docker.sock

    steps:
    - name: Environment Setup
      run: |
        if [ -n "${HTTP_PROXY}" ]; then echo "HTTP PROXY [${HTTP_PROXY}]"; sed -i -e s'/https/http/' /etc/apk/repositories; fi
        apk add git curl nodejs npm tar zstd docker-cli docker-cli-buildx
        until docker info > /dev/null 2>&1; do echo "Waiting for docker..."; sleep 1; done

    - name: Set build variables
      run: |
        echo "VERSIONARCH=${{ env.VERSION }}-${{ matrix.arch }}" >> $GITHUB_ENV
        echo "SHORT_SHA=$(echo ${{ gitea.sha }} | cut -c1-8)" >> $GITHUB_ENV

    - name: Registry FQDN Setup
      id: registry
      run: |
        registry=${{ gitea.server_url }}
        echo "registry=${registry##http*://}" >> "$GITHUB_OUTPUT"

    - name: Container Registry Login
      uses: docker/login-action@v3
      with:
        registry: ${{ steps.registry.outputs.registry }}
        username: ${{ gitea.actor }}
        password: ${{ secrets.PKG_WRITE_TOKEN }}

    - name: Code Checkout
      uses: actions/checkout@v4

    - name: Cache page assets
      id: cache-page-assets
      uses: actions/cache@v6
      with:
        path: |
          public/build
        key: pla-page-assets-${{ gitea.sha }}
        fail-on-cache-miss: true

    - name: Record version and Delete Unnecessary files
      id: prebuild
      run: |
        echo ${SHORT_SHA} > VERSION
        rm -rf .git* tests/ storage/app/test/
        cat VERSION public/VERSION

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        push: true
        pull: true
        tags: "${{ steps.registry.outputs.registry }}/${{ gitea.repository }}:${{ env.VERSIONARCH }}"
        build-args: |
          BUILD_REVISION=${{ gitea.sha }}
          BUILD_VERSION=v${{ gitea.ref_name }}
          BUILD_ARCH=${{ matrix.goarch }}

  manifest:
    name: Final Docker Image Manifest
    runs-on: docker-x86_64
    container:
      image: docker:cli
      privileged: false
    needs: [build]

    steps:
    - name: Environment Setup
      run: |
        if [ -n "${HTTP_PROXY}" ]; then echo "HTTP PROXY [${HTTP_PROXY}]"; sed -i -e s'/https/http/' /etc/apk/repositories; fi
        apk add git curl nodejs

    - name: Registry FQDN Setup
      id: registry
      run: |
        registry=${{ gitea.server_url }}
        echo "registry=${registry##http*://}" >> "$GITHUB_OUTPUT"

    - name: Container Registry Login
      uses: docker/login-action@v3
      with:
        registry: ${{ steps.registry.outputs.registry }}
        username: ${{ gitea.actor }}
        password: ${{ secrets.PKG_WRITE_TOKEN }}

    - name: Build Docker Manifest
      run: |
        docker buildx imagetools create \
          --tag ${{ steps.registry.outputs.registry }}/${{ gitea.repository }}:${{ env.VERSION }} \
          ${{ steps.registry.outputs.registry }}/${{ gitea.repository }}:${{ env.VERSION }}-x86_64 \
          ${{ steps.registry.outputs.registry }}/${{ gitea.repository }}:${{ env.VERSION }}-s390x \
          ${{ steps.registry.outputs.registry }}/${{ gitea.repository }}:${{ env.VERSION }}-arm64
        echo "Built container: ${{ steps.registry.outputs.registry }}/${{ gitea.repository }}:${{ env.VERSION }}"
